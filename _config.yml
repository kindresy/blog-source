# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 庐山东林
subtitle: ''
description: 'Embedded software knowledge sharing'
keywords: 'Linux PCIe eMMc ARM RTOS Firmware'
author: Luyuan
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://www.coffepattern.top
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: true
  tab_replace:
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
  嵌入式开发: embedded-tech
  PCIe: pcie
  I2C: i2c
  I3C: i3c
  MCTP 与 PLDM: mctp-pldm
  DMA: dma
  SD: sd
  AI: AI
  Claude Code: claude-code
  OpenClaw: openclaw
  生活记录: life-record
  协议基础: protocol-basics
  控制器与裸机开发: controller-baremetal
  Linux 驱动: linux-driver
  原理与网络: fundamentals-network
  移植与回归: porting-regression
  基础架构: architecture
  枚举与系统流程: enumeration-system
  驱动实例: driver-examples
  Endpoint 固件: endpoint-firmware
  协议与时序: protocol-timing
  控制器与驱动: controller-driver
  AXIDMA 硬件与裸机: axidma-baremetal
  Linux DMAEngine: linux-dmaengine
  核心概念: concepts
  技能与插件: skills-plugins
  使用排障: troubleshooting
  身心与状态: wellbeing
  旅行与见闻: travel
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: stellar

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/kindresy/kindresy.github.io.git
  branch: master

mathjax: true

